spring:
  application:
    name: portfolioback

  datasource:
    url: jdbc:mysql://localhost:3306/portfolio?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:ddl.sql
      continue-on-error: true

